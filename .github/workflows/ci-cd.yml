name: CI/CD — Test, Build Verify, Deploy to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # GHCR requires a lowercase image path. github.repository is "Owner/Repo" and
  # may contain uppercase letters, so it's lowered once here and reused by every job.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -v

  build-test-push:
    name: Build image, smoke-test, push to GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image tags
        id: vars
        run: |
          IMAGE="${IMAGE_NAME,,}"
          echo "image=$IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$IMAGE:latest" >> "$GITHUB_OUTPUT"

      # Build ONCE, tagged with both :latest and the short commit SHA. This exact image is
      # what gets smoke-tested below and, only if that passes, pushed to GHCR — so image
      # Render eventually pulls is provably same one this pipeline verified, not a
      # separate build Render (or GHCR) produces independently.
      - name: Build image
        run: |
          docker build \
            -t "${{ steps.vars.outputs.sha_tag }}" \
            -t "${{ steps.vars.outputs.latest_tag }}" \
            .

      - name: Smoke-test the built image
        run: |
          docker run -d --name mailflow-ci -p 7860:7860 "${{ steps.vars.outputs.latest_tag }}"

          echo "Waiting for Flask (internal, via docker exec) to become healthy..."
          for i in $(seq 1 20); do
            if docker exec mailflow-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')" 2>/dev/null; then
              echo "Flask Healthy."
              break
            fi
            sleep 3
          done
          docker exec mailflow-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"

          echo "Waiting for Streamlit (public port 7860) to respond..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:7860 > /dev/null 2>&1; then
              echo "Streamlit Healthy."
              break
            fi
            sleep 3
          done
          curl -sf http://localhost:7860 > /dev/null

          docker logs mailflow-ci
          docker stop mailflow-ci

      # Only reached if smoke test above succeeded. Uses workflow's own short-lived GUTHUB_TOKEN —
      # no extra secret needed for a public GHCR package.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image to GHCR
        run: |
          docker push "${{ steps.vars.outputs.sha_tag }}"
          docker push "${{ steps.vars.outputs.latest_tag }}"

  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build-test-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # No checkout needed — this step only fires Render's deploy hook, which tells Render to pull
      # ":latest" tag just pushed above (render.yaml configures service with runtime: image pointing
      # at that tag). Triggering from CI rather than relying on Render's own registry-watch/auto-deploy
      # makes test + build-test-push a real deployment guard.
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set." >&2
            exit 1
          fi
          response=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          cat /tmp/render_response.txt
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Render deploy triggered successfully (HTTP $response)."
          else
            echo "Render deploy hook failed (HTTP $response)." >&2
            exit 1
          fi
